services:
  - type: web
    name: epub-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_BUCKET_NAME
        value: epub-translator-bucket
      - key: CLOUDFLARE_R2_PUBLIC_URL
        value: https://pub-698cb88b6743407a8590d8e8d2f5b65b.r2.dev
