services:
  - type: web
    name: epub-backend
    env: python
    buildCommand: pip install -r requirements.txt && python -m alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_ENV
        value: production
      - key: BOOK_BIBLE_WRITE_TOKEN
        sync: false
      - key: STRUCTURED_STORAGE_BACKEND
        value: postgres
      - key: STRUCTURED_STORAGE_READ_SOURCE
        value: postgres
      - key: DB_POOL_SIZE
        value: 10
      - key: DB_MAX_OVERFLOW
        value: 20
      - key: STORAGE_PROVIDER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: novels
      - key: SUPABASE_STORAGE_PUBLIC_URL
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_BUCKET_NAME
        value: epub-translator-bucket
      - key: CLOUDFLARE_R2_PUBLIC_URL
        value: https://pub-698cb88b6743407a8590d8e8d2f5b65b.r2.dev
